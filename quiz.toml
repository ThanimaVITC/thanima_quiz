[quiz]
# Shown in the browser tab title.
name = "ormapadippu"

# Shown under the quiz title on the intro screen.
description = "How well do you know the life, philosophy, and legacy of Mahatma Gandhi?"

# Folder (relative to the project root) that holds the quiz JSON file — this
# is the "quiz db".
db_location = "quizzes"

# Which JSON file inside db_location holds this quiz's questions.
quiz_file = "gandhi-quiz.json"

# Controls whether the quiz can currently be taken:
#   "before" = not open yet — shows before_text instead of the quiz
#   "active" = normal — visitors can register and take the quiz
#   "done"   = closed — shows done_text instead of the quiz
state = "before"

before_text = "This quiz hasn't started yet. Please check back soon."
done_text = "This quiz has been completed and no more submissions will be taken."

# Applied to every question, regardless of what's in the quiz JSON.
max_time_per_question_seconds = 7

# true  = classic flow, one question shown at a time with its own countdown
# false = every question shown on a single page with one overall countdown,
#         answered via a "Submit Quiz" button
one_question_per_page = true

# How many questions to randomly draw from the quiz bank for each attempt.
# If this is >= the total number of questions in the bank, every question is used.
questions_per_attempt = 20

# "Get ready" countdown (5, 4, 3, 2, 1...) shown after clicking Begin Quiz and
# before the first question appears.
cooldown_seconds = 5
